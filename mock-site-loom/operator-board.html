<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aliou Wade · Operator Board</title>
  <meta name="description" content="Single-viewport operator board — live proof, comms, and ledger for a Product Systems Engineer.">
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="operator-board.css">
</head>
<body class="operator-board">
  <a href="#board" class="skip-link">Skip to board</a>
  <div class="ambient-grain" aria-hidden="true"></div>

  <main class="board" id="board">
    <div class="boot-overlay" id="bootOverlay" aria-hidden="true">
      <div class="boot-lines mono" id="bootLines"></div>
    </div>

    <header class="board-rail" id="statusRail">
      <div class="rail-brand">
        <div class="rail-mark mono" aria-hidden="true">AW</div>
        <div class="rail-identity">
          <p class="rail-greeting mono" id="statusGreeting"></p>
          <div class="rail-title-row">
            <h1 class="rail-name">Aliou Wade</h1>
            <span class="rail-sep mono" aria-hidden="true">/</span>
            <span class="rail-role mono" id="railRole">Product Systems Engineer</span>
          </div>
        </div>
      </div>
      <div class="rail-context mono">
        <span>Dakar · <span id="dakarclock" aria-label="Local time"></span></span>
        <span class="rail-context-sep" aria-hidden="true">·</span>
        <span class="locale-switch" id="localeSwitch" role="group" aria-label="Language"></span>
        <span class="rail-context-sep" aria-hidden="true">·</span>
        <span class="rail-availability" id="statusSlots">Two client slots · Q3 2026</span>
      </div>
    </header>

    <div class="board-body" id="boardBody">
      <section class="proof-zone" aria-label="Proof stage">
        <div class="proof-nav">
          <div class="nav-row">
            <span class="nav-label mono">Domain</span>
            <div class="domain-tabs" id="domainTabs" role="tablist" aria-label="Proof domains"></div>
          </div>
          <div class="nav-row nav-row--nested">
            <span class="nav-label mono">↳ Proof</span>
            <div class="case-tabs" id="proofPeeks" role="tablist" aria-label="Work records"></div>
          </div>
        </div>

        <div
          class="proof-stage"
          id="proofStage"
          role="tabpanel"
          aria-live="polite"
          aria-labelledby="domainTabs"
        >
          <p class="proof-domain-desc mono" id="proofDomainDesc"></p>
          <div class="proof-anchor-tray">
            <article class="proof-anchor" id="proofAnchor"></article>
          </div>
        </div>
      </section>

      <aside class="comms-zone" aria-label="Contact and principles">
        <div class="comms-tray">
          <div class="comms-core" id="commsCore"></div>
        </div>
        <ul class="principles-list" id="principlesList" aria-label="Operating principles"></ul>
        <p class="comms-note" id="commsNote"></p>
      </aside>
    </div>

    <footer class="ledger-bar" id="ledgerBar">
      <div class="ledger-collapsed" id="ledgerCollapsed">
        <div class="ledger-group">
          <span class="ledger-group-label mono">Employers</span>
          <div class="ledger-employers" id="ledgerEmployersPreview"></div>
        </div>
        <div class="ledger-group">
          <span class="ledger-group-label mono">Client builds</span>
          <div class="ledger-clients" id="ledgerClientsPreview"></div>
        </div>
        <button type="button" class="ledger-expand-btn glass-btn mono" id="ledgerExpandBtn" aria-expanded="false" aria-controls="ledgerExpanded" aria-label="Expand full work record">
          Full record
        </button>
      </div>

      <div class="ledger-expanded" id="ledgerExpanded" hidden>
        <div class="ledger-expanded-head">
          <h2 class="ledger-title mono">Work record</h2>
          <button type="button" class="ledger-close glass-btn mono" id="ledgerCloseBtn" aria-label="Close full record">Close</button>
        </div>
        <div class="ledger-expanded-grid">
          <section class="ledger-panel" aria-labelledby="employersHeading">
            <h3 class="panel-label mono" id="employersHeading">Employers</h3>
            <ul class="employer-list" id="employerList"></ul>
          </section>
          <section class="ledger-panel" aria-labelledby="clientsHeading">
            <h3 class="panel-label mono" id="clientsHeading">Client builds</h3>
            <ul class="client-list" id="clientList"></ul>
          </section>
          <section class="ledger-panel ledger-panel--writing" aria-labelledby="notesHeading">
            <h3 class="panel-label mono" id="notesHeading">Field notes</h3>
            <div class="field-notes-card essay-teaser" id="essayTeaser"></div>
          </section>
        </div>
        <div class="ledger-toolkit" aria-labelledby="toolkitHeading">
          <span class="toolkit-label mono" id="toolkitHeading">Toolkit</span>
          <div class="stack-list" id="stackList"></div>
        </div>
      </div>
    </footer>
  </main>

  <div class="copy-toast mono" id="copyToast" role="status" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="flow-data.js"></script>
  <script src="operator-board.js"></script>
</body>
</html>
